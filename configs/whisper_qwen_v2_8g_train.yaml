# 8GB 显存专用：关闭 backbone 微调 + 减少 I/O/验证开销，避免共享显存拖死训练
seed: 42
chunk_ms: 80
context_chunks: 375
target_chunks: 25
stride: 15
sample_rate: 16000
max_train_samples: null
max_valid_samples: null
num_workers: 0
prefetch_factor: 2

paths:
  project_root: D:/bisai/2026_finvcup_baseline
  train_audio_dir: D:/bisai/2026_finvcup_baseline/train/audio
  train_text_dir: D:/bisai/2026_finvcup_baseline/train/text
  train_labels_dir: D:/bisai/2026_finvcup_baseline/train/labels

  output_root: D:/bisai/2026_finvcup_baseline/outputs/v2_8g
  checkpoints_dir: D:/bisai/2026_finvcup_baseline/outputs/v2_8g/checkpoints
  logs_dir: D:/bisai/2026_finvcup_baseline/outputs/v2_8g/logs

  cache_root: D:/bisai/2026_finvcup_baseline/.cache

labels:
  C: 0
  T: 1
  BC: 2
  I: 3
  NA: 4
  positive_ids: [1, 2, 3]
  multi_targets: [C, NA, I, BC, T]

split:
  valid_ratio: 0.1
  by_conversation: true

audio_encoder:
  type: whisper
  model_name: openai/whisper-large-v3
  proj_dim: 512
  freeze: true
  unfreeze_layers: 0
  tail_ratio: 0.2
  encode_tail_audio: true

text_encoder:
  model_name: Qwen/Qwen3-0.6B
  max_length: 192
  freeze_backbone: true
  unfreeze_layers: 0
  tail_ratio: 0.5

context_encoder:
  vocab_size: 5
  embed_dim: 32
  channels: [64, 128]

fusion:
  hidden_dim: 256
  bilinear_rank: 64
  dropout: 0.3
  modality_dropout: 0.15

train:
  multi_label: true
  pos_weight_mode: capped_per_label
  pos_weight_cap: 10.0
  focal_gamma: 2.0

  epochs: 40
  max_steps_per_epoch: 3000
  eval_valid_sample_count: 2000
  eval_valid_max_batches: 500
  eval_valid_shuffle: false

  batch_size: 1
  eval_batch_size: 1
  log_every_steps: 20

  learning_rate: 5.0e-5
  warmup_ratio: 0.01
  ema_decay: 0.98
  model_ema_decay: 0.0
  weight_decay: 0.01
  grad_clip_norm: 1.0
  use_amp: true
  gradient_accumulation_steps: 8
  save_metric: best_f1
  best_checkpoint_name: best_v2_8g.pt
  early_stop_patience: 10

infer:
  apply_label_constraints: true

env:
  HF_HOME: D:/bisai/2026_finvcup_baseline/.cache/huggingface
  TRANSFORMERS_CACHE: D:/bisai/2026_finvcup_baseline/.cache/huggingface
  TORCH_HOME: D:/bisai/2026_finvcup_baseline/.cache/torch
  HF_ENDPOINT: https://hf-mirror.com
