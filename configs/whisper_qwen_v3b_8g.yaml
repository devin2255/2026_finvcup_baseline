# v3b: 回退配置，比 v3 弱化正样本偏置
# 触发条件：v3 训到 epoch 5 时 best_micro_f1 < 0.83，或 train/prob_mean 持续 > 0.75
# 关键变化（相对 v3）：
#   - pos_weight_cap 12 → 3（ASL 已经非对称，不需要再叠这么重的 pos_weight）
#   - asl_clip 0.05 → 0.02（更温和地压制 easy negatives，让模型不要太确信）
#   - audio_encoder.unfreeze_layers 2 → 1（万一显存吃紧）
#   - sampler.alpha 0.5 → 0.3（弱化对 BC 的过采样，缓解模型"全部预测正"倾向）

seed: 42
chunk_ms: 80
context_chunks: 375
target_chunks: 25
stride: 5
sample_rate: 16000
max_train_samples: null
max_valid_samples: null
num_workers: 2

paths:
  project_root: D:/bisai/2026_finvcup_baseline
  train_audio_dir: D:/bisai/2026_finvcup_baseline/train/audio
  train_text_dir: D:/bisai/2026_finvcup_baseline/train/text
  train_labels_dir: D:/bisai/2026_finvcup_baseline/train/labels

  output_root: D:/bisai/2026_finvcup_baseline/outputs/v3b_8g
  checkpoints_dir: D:/bisai/2026_finvcup_baseline/outputs/v3b_8g/checkpoints
  logs_dir: D:/bisai/2026_finvcup_baseline/outputs/v3b_8g/logs

  cache_root: D:/bisai/2026_finvcup_baseline/.cache

labels:
  C: 0
  T: 1
  BC: 2
  I: 3
  NA: 4
  positive_ids: [1, 2, 3]
  multi_targets: [C, NA, I, BC, T]

split:
  valid_ratio: 0.1
  by_conversation: true

audio_encoder:
  type: whisper
  model_name: openai/whisper-large-v3
  proj_dim: 512
  freeze: true
  unfreeze_layers: 1
  tail_ratio: 0.2
  encode_tail_audio: true

text_encoder:
  model_name: Qwen/Qwen3-0.6B
  max_length: 256
  freeze_backbone: true
  unfreeze_layers: 2
  tail_ratio: 0.3

context_encoder:
  vocab_size: 5
  embed_dim: 16
  channels: [32, 64]

fusion:
  hidden_dim: 256
  bilinear_rank: 48
  dropout: 0.2
  modality_dropout: 0.1

train:
  multi_label: true

  loss: asl
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_clip: 0.02
  pos_weight_mode: capped_per_label
  pos_weight_cap: 3.0
  focal_gamma: 0.0

  epochs: 40
  max_steps_per_epoch: 5000
  eval_valid_sample_count: 4000
  eval_valid_max_batches: null
  eval_valid_shuffle: false

  batch_size: 1
  eval_batch_size: 2
  log_every_steps: 40

  learning_rate: 5.0e-5
  backbone_learning_rate: 5.0e-6
  warmup_ratio: 0.02
  ema_decay: 0.98
  model_ema_decay: 0.999
  weight_decay: 0.01
  grad_clip_norm: 1.0
  use_amp: true
  gradient_accumulation_steps: 8

  save_metric: best_micro_f1
  best_checkpoint_name: best_v3b.pt
  save_topk: 3
  early_stop_patience: 15

  sampler:
    type: weighted
    alpha: 0.3
    max_weight: 5.0

env:
  HF_HOME: D:/bisai/2026_finvcup_baseline/.cache/huggingface
  TRANSFORMERS_CACHE: D:/bisai/2026_finvcup_baseline/.cache/huggingface
  TORCH_HOME: D:/bisai/2026_finvcup_baseline/.cache/torch
  HF_ENDPOINT: https://hf-mirror.com
